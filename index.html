function init(s){state.stage=s;state.legacyStage=false;state.contentVersion=2;state.seed=(Date.now()>>>0)||0x9e3779b9;state.b=Array(25).fill(null);state.q=[next(),next(),next()];state.done={};state.moves=0;state.score=0;state.tool=1;state.shatter=false;for(let i=0;i<cfg[s].n;i++)spawn();save();}

 if(turnAnimating || state.screen!=='puzzle' || !['left','right','up','down'].includes(dir))return;
 const outcome=window.JunktopiaCore.transition(state.b,dir,activeCfg().need,state.done);
 if(!outcome.changed)return;
 state.b=outcome.board;
 state.done=outcome.done;
 state.score+=outcome.scoreDelta;
 state.moves++;
 if(!outcome.targetsDone)spawn();
 if(outcome.targetsDone){
  state.screen='win';
  const key=String(state.stage);
  state.best[key]=Math.min(state.best[key]??Infinity,state.moves);

  if(state.stage===2)state.repaired.work=true;
  if(state.stage===5)state.repaired.beacon=true;
 }else if(!canMove())state.screen='lose';
 tone(outcome.merges.length?'merge':'tap');
 save();
 turnAnimating=true;
 const endingScreen=state.screen;

  turnAnimating=false;
  if(state.screen===endingScreen&&endingScreen!=='puzzle')render();
 };
 try{
  const effect=window.JunktopiaMotion?.play(document.getElementById('board'),outcome.tracks,outcome.merges,{mode:state.motionMode||'auto'});

  else done();
 }catch(error){done();}

function tone(kind){try{if(state.vibrate&&navigator.vibrate)navigator.vibrate(kind==='merge'?22:8);if(!state.sound)return;const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),o=c.createOscillator(),g=c.createGain();o.frequency.value=kind==='merge'?650:350;g.gain.value=.045;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.09);o.onended=()=>c.close();}catch(e){}}

 return '<div class="story-panel dormant-message"><div class="dormant-icon" aria-hidden="true">◌</div><p><strong>眠っているロボット</strong><br>壊れた修理用ロボットを発見。<br>歯車を作って起こしてあげよう。</p></div>';
}

 const r=repaired||{};
 return [
  {id:'robot',name:'ポンコ',detail:'修理ロボットを起動',done:!!r.robot},
  {id:'work',name:'作業場',detail:'工房の機能を復旧',done:!!r.work},
  {id:'choice',name:r.flower?'花壇':'街灯・花壇',detail:r.flower?'花壇を再生':r.lamp?'街灯を点灯':'好きな施設を選んで修復',done:!!(r.lamp||r.flower)},

function render(overrideScreen){if(document.body?.dataset)document.body.dataset.motionMode=state.motionMode||'auto';const s=overrideScreen||state.screen||'home',n=state.stage,c=activeCfg(),rep=restorationPercent(state.repaired);
if(s==='home'){html('<div class="title-logo">JUNKTOPIA</div><div class="logo-subtitle">ガラクタ惑星</div><p class="intro-line">捨てられたモノから、星をなおそう。</p>'+planet()+ponkoHomePanel()+chapterCard(n)+'<div class="card"><div class="row"><b>ポッケ星</b><b>復興率 '+rep+'%</b></div><div class="meter"><div style="width:'+rep+'%"></div></div>'+restorationGrid(state.repaired)+'<p>STAGE '+n+'　'+c.title+'</p></div><button id="play">パズルをはじめる ▶</button><button class="alt" id="journal">星の記録を見る</button><button class="alt" id="catalog">ガラクタ図鑑（全16種類）</button><button class="alt" id="settings">設定・遊び方</button><div class="footer">完全無料・広告なし・V0.8｜全16種類のガラクタ</div>');document.getElementById('play').onclick=()=>{state.screen='puzzle';save();render();};document.getElementById('settings').onclick=()=>{state.screen='settings';render();};document.getElementById('journal').onclick=()=>{state.screen='journal';render();};document.getElementById('catalog').onclick=()=>{state.screen='catalog';render();};return;}
if(s==='puzzle'){html('<div class="row"><button id="pause" class="alt" style="width:auto">‹ 中断</button><span class="ey">STAGE '+n+'</span></div><div class="stage-kicker">REPAIR MISSION　'+String(n).padStart(2,'0')+' / '+(cfg.length-1)+'</div><h2>'+c.title+'</h2><div class="card mission-card"><span class="mission-eyebrow">本日の修復依頼</span><div class="mission-targets">'+targets()+'</div></div><div class="run-stats"><span class="run-stat"><small>RECOVERY POINTS</small><strong>'+state.score+'</strong></span><span class="run-stat"><small>SWIPES</small><strong>'+state.moves+'</strong></span></div><div class="board'+(turnAnimating?' motion-active':'')+'" id="board">'+state.b.map((a,i)=>'<div class="tile '+(a?'filled '+({w:'wood',e:'electronic',g:'glass'}[a.k]||''):'')+'" data-i="'+i+'">'+(a?window.JunktopiaArt.itemSVG(a)+'<small>Lv.'+a.l+'</small>':'')+'</div>').join('')+'</div><div class="card row"><div><div class="muted">次のガラクタ</div><div class="queue-items">'+state.q.map(a=>'<span class="queue-item queue-'+a.k+'">'+window.JunktopiaArt.itemSVG(a)+'</span>').join('')+'</div></div></div><button class="alt" id="tool">'+(state.shatter?'解体するマスをタップ（中止）':'解体ツール ×'+state.tool)+'</button><p class="muted">上下左右にスワイプして同じアイテムを合体！</p>');document.getElementById('pause').onclick=navHome;document.getElementById('tool').onclick=()=>{if(state.tool){state.shatter=!state.shatter;render();}};const b=document.getElementById('board');let start=null;b.onpointerdown=e=>{start={x:e.clientX,y:e.clientY};b.setPointerCapture(e.pointerId)};b.onpointerup=e=>{if(!start)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;start=null;if(Math.hypot(dx,dy)<22){if(state.shatter){const rect=b.getBoundingClientRect(),x=Math.floor((e.clientX-rect.left-7)/(rect.width-14)*5),y=Math.floor((e.clientY-rect.top-7)/(rect.height-14)*5),i=y*5+x;if(i>=0&&i<25&&state.b[i]){state.b[i]=null;state.tool--;state.shatter=false;state.score=Math.max(0,state.score-10);save();render();}}return;}if(state.shatter)return;move(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up');};return;}

 (remaining?'<button id="continue">'+(n>=15?'第四章':n>=10?'第三章':'第二章')+'へ進む ▶</button>':'')+
 '<button id="retry">ステージ'+n+'をもう一度</button><button class="alt" id="home">惑星へ戻る</button>');
