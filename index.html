<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101d33"><title>Junktopia | ガラクタ惑星</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f5fbff;background:#081727}*{box-sizing:border-box}body{margin:0;user-select:none;-webkit-user-select:none}main{max-width:520px;min-height:100dvh;margin:auto;padding:22px 18px max(20px,env(safe-area-inset-bottom));background:radial-gradient(circle at 80% 15%,#29536c 0,transparent 34%),#102239}h1{font-size:35px;margin:8px 0}h2{font-size:24px;margin:12px 0}p{line-height:1.6;color:#bcd1e1}.ey{color:#85e0ba;letter-spacing:.18em;font-size:13px;font-weight:bold}.card{border-radius:16px;background:#203851;border:1px solid #34566b;padding:16px;margin:14px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.muted{color:#b8cddc;font-size:13px}button{display:block;width:100%;border:0;border-radius:13px;padding:14px 12px;margin:9px 0;background:#83e0ba;color:#133343;font-size:17px;font-weight:800;min-height:49px;touch-action:manipulation}button.alt{background:#304d66;color:white}button:disabled{opacity:.4}.planet{width:min(71vw,280px);height:min(71vw,280px);border-radius:50%;margin:30px auto;position:relative;background:radial-gradient(circle at 29% 27%,#829e8c,#39637a 64%,#1b364c);box-shadow:0 0 0 14px #65d6a40b,0 0 55px #63caba40;display:grid;place-items:center;font-size:50px}.planet .piece{position:absolute;font-size:35px;filter:drop-shadow(0 3px 2px #092333);}.planet .robot{top:27%;left:23%}.planet .work{top:53%;right:16%}.planet .flower{bottom:12%;left:25%}.planet .lamp{top:9%;right:21%}.planet .beacon{top:7%;left:44%}.meter{height:9px;border-radius:10px;background:#36546b;overflow:hidden}.meter>div{background:#83e0ba;height:100%}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;touch-action:none;background:#142a40;border:2px solid #446078;border-radius:14px;padding:7px;aspect-ratio:1;width:100%;margin:14px auto}.tile{background:#2b4359;border-radius:8px;display:grid;place-items:center;text-align:center;min-width:0;overflow:hidden}.tile.filled{background:#eda76b;color:#253142}.tile.wood{background:#88d1a2}.tile b{font-size:clamp(11px,3.2vw,16px)}.tile small{font-size:10px}.pill{border-radius:9px;background:#2e5068;padding:9px}.score{font-weight:800;color:#f9d588}.choices button{text-align:left;background:#2e5068;color:#fff}.choices small{display:block;font-weight:400;margin-top:6px}.footer{margin-top:22px;text-align:center;color:#86a7b9;font-size:12px}.stars{font-size:38px;color:#ffd17b;text-align:center}.safe{padding-bottom:env(safe-area-inset-bottom)}
</style><link rel="stylesheet" href="assets/junktopia-theme.css?v=04"></head><body><main id="app"><p>JavaScriptを有効にしたブラウザで開いてください。</p></main><script src="assets/junktopia-art.js?v=04"></script><script>
'use strict';
const cfg=[
null,
{title:'ポンコを起こそう',need:{'m3':1},kinds:['m'],n:3},
{title:'作業場をなおそう',need:{'m3':2},kinds:['m'],n:3},
{title:'星に彩りを',need:{'m3':1,'w3':1},kinds:['m','w'],n:4},
{title:'もうひとつの願い',need:{'w3':2},kinds:['w','w','w','m'],n:4},
{title:'小さな夜明け',need:{'m4':1},kinds:['m','m','m','w'],n:4}
];
const names={m:['空き缶','鉄くず','歯車','動力部品'],w:['小枝','板材','木枠','建築部品']};
const key='junktopia-web-v01';
let state;
function next(){const kinds=cfg[state.stage].kinds;return {k:kinds[Math.floor(Math.random()*kinds.length)],l:1};}
function init(s){state.stage=s;state.b=Array(25).fill(null);state.q=[next(),next(),next()];state.done={};state.moves=0;state.score=0;state.tool=1;state.shatter=false;state.seed=(Date.now()>>>0);for(let i=0;i<cfg[s].n;i++)spawn();save();}
function rand(){let x=state.seed>>>0;x^=x<<13;x^=x>>>17;x^=x<<5;state.seed=x>>>0;return state.seed/4294967296;}
function spawn(){const empty=state.b.map((v,i)=>v===null?i:-1).filter(i=>i>=0);if(!empty.length)return;state.b[empty[Math.floor(rand()*empty.length)]]=state.q.shift();state.q.push(next());}
function fresh(){return {stage:1,screen:'home',repaired:{},best:{},sound:true,vibrate:true};}
function load(){try{const d=JSON.parse(localStorage.getItem(key));if(d&&d.stage>0&&d.stage<=5&&d.b?.length===25&&d.q?.length===3)return d;}catch(e){}const d=fresh();state=d;init(1);return state;}
function save(){try{localStorage.setItem(key,JSON.stringify(state));}catch(e){}}
function equal(a,b){return a&&b&&a.k===b.k&&a.l===b.l&&a.l<4}
function targetsDone(){return Object.entries(cfg[state.stage].need).every(([k,n])=>(state.done[k]||0)>=n);}
function canMove(){if(state.tool>0&&state.b.some(Boolean))return true;if(state.b.includes(null))return true;for(let y=0;y<5;y++)for(let x=0;x<5;x++){const i=y*5+x;if(x<4&&equal(state.b[i],state.b[i+1]))return true;if(y<4&&equal(state.b[i],state.b[i+5]))return true;}return false;}
function move(dir){let b=state.b.slice(),merged=0,changed=false;
for(let n=0;n<5;n++){const indices=[];for(let v=0;v<5;v++){let x=dir==='left'?v:dir==='right'?4-v:n,y=dir==='up'?v:dir==='down'?4-v:n;if(dir==='up'||dir==='down')x=n;else y=n;indices.push(y*5+x);}
const row=indices.map(i=>b[i]).filter(Boolean),out=[];for(let i=0;i<row.length;i++){const a=row[i],c=row[i+1];if(equal(a,c)){const t={k:a.k,l:a.l+1},id=t.k+t.l;state.done[id]=state.done[id]||0;if(cfg[state.stage].need[id]&&state.done[id]<cfg[state.stage].need[id]){state.done[id]++;}else out.push(t);state.score+=10*(2**t.l);merged++;i++;}else out.push(a);}
indices.forEach((id,i)=>{const value=out[i]||null;if(JSON.stringify(b[id])!==JSON.stringify(value))changed=true;b[id]=value;});}
if(!changed){return;}state.b=b;state.moves++;if(!targetsDone())spawn();if(targetsDone()){state.screen='win';const s=String(state.stage);state.best[s]=Math.min(state.best[s]??Infinity,state.moves);if(state.stage===1)state.repaired.robot=true;if(state.stage===2)state.repaired.work=true;if(state.stage===5)state.repaired.beacon=true;}else if(!canMove())state.screen='lose';tone(merged?'merge':'tap');save();render();}
function tone(kind){try{if(state.vibrate&&navigator.vibrate)navigator.vibrate(kind==='merge'?22:8);if(!state.sound)return;const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),o=c.createOscillator(),g=c.createGain();o.frequency.value=kind==='merge'?650:350;g.gain.value=.045;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.09);o.onended=()=>c.close();}catch(e){}}
function text(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function item(a){return a?names[a.k][a.l-1]:'—';}
function planet(){return window.JunktopiaArt.planet(state.repaired||{});}
function targets(){return Object.entries(cfg[state.stage].need).map(([id,n])=>{const t={k:id[0],l:Number(id[1])},done=state.done[id]||0;return '<span class="mission-target">'+window.JunktopiaArt.itemSVG(t)+'<span>'+names[t.k][t.l-1]+'<b>'+done+'/'+n+'</b></span></span>';}).join('');}
function html(s){document.getElementById('app').innerHTML=s;}
function navHome(){state.screen='home';save();render();}
function render(){const s=state.screen||'home',n=state.stage,c=cfg[n],rep=Object.keys(state.repaired).filter(k=>state.repaired[k]).length;
if(s==='home'){html('<div class="title-logo">JUNKTOPIA</div><div class="logo-subtitle">ガラクタ惑星</div><p class="intro-line">捨てられたモノから、星をなおそう。</p>'+planet()+'<div class="story-panel">'+window.JunktopiaArt.ponko()+'<p><strong>ポンコ</strong><br>これ、まだ使えるかも！<br>いっしょに星を直そう！</p></div><div class="card"><div class="row"><b>ポッケ星</b><b>復興率 '+rep*20+'%</b></div><div class="meter"><div style="width:'+rep*20+'%"></div></div><p>STAGE '+n+'　'+c.title+'</p></div><button id="play">パズルをはじめる ▶</button><button class="alt" id="settings">設定・遊び方</button><div class="footer">完全無料・広告なし・V0.2.2｜動き改良版</div>');document.getElementById('play').onclick=()=>{state.screen='puzzle';save();render();};document.getElementById('settings').onclick=()=>{state.screen='settings';render();};return;}
if(s==='puzzle'){html('<div class="row"><button id="pause" class="alt" style="width:auto">‹ 中断</button><span class="ey">STAGE '+n+'</span></div><h2>'+c.title+'</h2><div class="card"><span class="muted">修理依頼</span><div class="mission-targets">'+targets()+'</div></div><div class="row"><span class="score">SCORE '+state.score+'</span><span class="muted">MOVE '+state.moves+'</span></div><div class="board" id="board">'+state.b.map((a,i)=>'<div class="tile '+(a?'filled '+(a.k==='w'?'wood':''):'')+'" data-i="'+i+'">'+(a?window.JunktopiaArt.itemSVG(a)+'<small>Lv.'+a.l+'</small>':'')+'</div>').join('')+'</div><div class="card row"><div><div class="muted">次のガラクタ</div><div class="queue-items">'+state.q.map(a=>'<span class="queue-item">'+window.JunktopiaArt.itemSVG(a)+'</span>').join('')+'</div></div></div><button class="alt" id="tool">'+(state.shatter?'解体するマスをタップ（中止）':'解体ツール ×'+state.tool)+'</button><p class="muted">上下左右にスワイプして同じアイテムを合体！</p>');document.getElementById('pause').onclick=navHome;document.getElementById('tool').onclick=()=>{if(state.tool){state.shatter=!state.shatter;render();}};const b=document.getElementById('board');let start=null;b.onpointerdown=e=>{start={x:e.clientX,y:e.clientY};b.setPointerCapture(e.pointerId)};b.onpointerup=e=>{if(!start)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;start=null;if(Math.hypot(dx,dy)<22){if(state.shatter){const rect=b.getBoundingClientRect(),x=Math.floor((e.clientX-rect.left-7)/(rect.width-14)*5),y=Math.floor((e.clientY-rect.top-7)/(rect.height-14)*5),i=y*5+x;if(i>=0&&i<25&&state.b[i]){state.b[i]=null;state.tool--;state.shatter=false;state.score=Math.max(0,state.score-10);save();render();}}return;}if(state.shatter)return;move(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up');};return;}
if(s==='win'||s==='lose'){const won=s==='win';html('<div class="ey">STAGE '+n+'</div><h1>'+(won?'修理完了！':'作業場がいっぱい！')+'</h1>'+planet()+'<div class="card"><div class="stars">'+(won?'★★★':'☆')+'</div><div class="row"><span>スコア '+state.score+'</span><span>手数 '+state.moves+'</span></div></div><button id="go">'+(won?'惑星へ戻る ▶':'もう一度挑戦')+'</button><button class="alt" id="retry">このステージをやり直す</button>');document.getElementById('go').onclick=()=>{if(!won){init(n);state.screen='puzzle';save();render();return;}if(n===3){state.screen='repair';}else if(n===5){state.screen='end';}else{init(n+1);state.screen='home';}save();render();};document.getElementById('retry').onclick=()=>{init(n);state.screen='puzzle';save();render();};return;}
if(s==='repair'){html('<h1>復興の分かれ道</h1><p>ポンコ「どちらを先になおそう？」</p>'+planet()+'<div class="choices"><button id="lamp">💡 古い街灯をなおす<small>惑星の夜に暖かな光を灯す</small></button><button id="flower">🌼 枯れた花壇をなおす<small>小さな花を咲かせる</small></button></div>');['lamp','flower'].forEach(k=>document.getElementById(k).onclick=()=>{state.repaired[k]=true;init(4);state.screen='home';save();render();});return;}
if(s==='end'){html('<div class="ey">PROTOTYPE COMPLETE</div><h1>ポッケ星に夜明けが。</h1>'+planet()+'<p>5ステージ達成！ガラクタ惑星の試作はここまで。</p><button id="retry">ステージ5をもう一度</button><button class="alt" id="home">惑星へ戻る</button>');document.getElementById('retry').onclick=()=>{init(5);state.screen='puzzle';render()};document.getElementById('home').onclick=navHome;return;}
if(s==='settings'){html('<h1>設定・遊び方</h1><div class="card"><p>上下左右にスワイプして同じ素材を合体させ、指定の部品を完成させましょう。部品は自動納品されます。解体は各ステージ1回使えます。</p></div><button class="alt" id="sound">効果音：'+(state.sound?'ON':'OFF')+'</button><button class="alt" id="vib">振動：'+(state.vibrate?'ON':'OFF')+'</button><button id="home">惑星へ戻る</button>');document.getElementById('sound').onclick=()=>{state.sound=!state.sound;save();render()};document.getElementById('vib').onclick=()=>{state.vibrate=!state.vibrate;save();render()};document.getElementById('home').onclick=navHome;}
}
state=load();render();window.addEventListener('keydown',e=>{if(state.screen!=='puzzle')return;const dir={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];if(dir){e.preventDefault();move(dir);}});
</script></body></html>
